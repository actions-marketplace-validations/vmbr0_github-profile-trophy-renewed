name: Update trophy image

# Regenerates trophy.svg for the owner of this repo and commits it.
# The file is what you embed on a GitHub profile when you do not want to
# pay for, or configure, a Vercel deployment.
on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophy
        uses: ./.
        with:
          username: ${{ github.repository_owner }}
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          if git diff --staged --quiet; then
            echo "Trophy unchanged"
            exit 0
          fi
          git commit -m "chore: update trophy.svg"
          git push
